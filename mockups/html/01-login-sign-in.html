<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosted login — credentials</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #4C5FE0; text-decoration: none; } a:hover { color: #3B4CC4; text-decoration: underline; }
  </style>
<style>* { box-sizing: border-box; } html, body { margin: 0; }</style>
</head>
<body>
<div style="width: 480px; min-height: 660px; padding: 60px 24px 32px; background: radial-gradient(760px 380px at 50% -8%, #E4E9FA 0%, transparent 62%), #F3F5FB; color: #141824; font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <div style="max-width: 25.5rem; margin: 0 auto;">
  <header style="display: flex; align-items: center; gap: 0.55rem; margin-bottom: 1.7rem;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4C5FE0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.4-3 8.2-7.5 9.5-4.5-1.3-7.5-5.1-7.5-9.5V6z"></path></svg>
    <p style="margin: 0; font-size: 0.86rem; font-weight: 600; letter-spacing: -0.01em; color: #141824;">RBA Identity</p>
  </header>
  <main style="background: #FFFFFF; border: 1px solid #DDE3F0; border-radius: 10px; padding: 1.9rem 1.7rem 1.7rem; box-shadow: 0 1px 2px rgba(20,24,36,.05), 0 14px 40px -18px rgba(20,24,36,.22);">
      <h1 style="margin: 0 0 0.4rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em;">Sign in</h1>
      <p style="margin: 0 0 0.5rem; color: #59627A; line-height: 1.5; font-size: 0.95rem;">Continue to Roku Bank.</p>
      <p style="margin: 1.05rem 0 0.35rem; font-size: 0.75rem; font-weight: 500; color: #59627A;">Email</p>
      <div style="width: 100%; padding: 0.72rem 0.8rem; border-radius: 7px; border: 1px solid #DDE3F0; background: #FFFFFF; color: #141824; font-size: 0.95rem; letter-spacing: 0;">demo@example.com</div>
      <p style="margin: 1.05rem 0 0.35rem; font-size: 0.75rem; font-weight: 500; color: #59627A;">Password</p>
      <div style="width: 100%; padding: 0.72rem 0.8rem; border-radius: 7px; border: 1px solid #4C5FE0; box-shadow: 0 0 0 3px #E9ECFD; background: #FFFFFF; color: #141824; font-size: 0.95rem; letter-spacing: 0.14em;">••••••••••••</div>
      <div style="width: 100%; margin-top: 1.4rem; padding: 0.78rem 0.9rem; border-radius: 7px; background: #4C5FE0; color: #fff; font-size: 0.92rem; font-weight: 600; text-align: center;">Continue</div>
  </main>
  <p style="margin: 1.5rem 0 0; text-align: center; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.68rem; letter-spacing: 0.02em; color: #8A93A8;">passwords stay on this idp · scoring delegated to the pdp</p>
  </div>
</div>
</body>
</html>
